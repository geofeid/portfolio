<section class="container">
  @if (data.content(); as c) {
    <div class="header-content">
      <div class="left-header">
        <div class="h-shape"></div>
        <div class="image">
          <img src="img/geofeid.jpeg" alt="{{ c.home.name }}" />
        </div>
      </div>
      <div class="right-header">
        <h1 class="name">
          {{ c.home.greeting }} <span>{{ c.home.name }}.</span><br />
          {{ c.home.title }}
        </h1>
        <p>{{ c.home.intro }}</p>
        <div class="btn-con">
          <a href="https://geofeid.github.io/Online_CV/Georgios%20Feidakis%20CV.pdf" download class="main-btn">
            <span class="btn-text">Download CV</span>
            <span class="btn-icon"><i class="fas fa-download"></i></span>
          </a>
        </div>
      </div>
    </div>
  } @else if (data.error(); as err) {
    <p class="load-error">{{ err }}</p>
  }
</section>
