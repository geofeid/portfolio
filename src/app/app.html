<router-outlet />

<div class="controls">
  <button class="control" routerLink="/" routerLinkActive="active-btn" [routerLinkActiveOptions]="{ exact: true }" aria-label="Home">
    <i class="fas fa-home"></i>
  </button>
  <button class="control" routerLink="/about" routerLinkActive="active-btn" aria-label="About">
    <i class="fas fa-user"></i>
  </button>
  <button class="control" routerLink="/portfolio" routerLinkActive="active-btn" aria-label="Portfolio">
    <i class="fas fa-briefcase"></i>
  </button>
  <button class="control" routerLink="/blogs" routerLinkActive="active-btn" aria-label="Blogs">
    <i class="fas fa-newspaper"></i>
  </button>
  <button class="control" routerLink="/contact" routerLinkActive="active-btn" aria-label="Contact">
    <i class="fas fa-envelope-open"></i>
  </button>
</div>

<button class="theme-btn" (click)="toggleTheme()" aria-label="Toggle theme">
  <i class="fas fa-adjust"></i>
</button>
