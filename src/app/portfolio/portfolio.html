<section class="container">
  @if (data.content(); as c) {
    <div class="main-title">
      <h2>My <span>Portfolio</span><span class="bg-text">My Work</span></h2>
    </div>
    <p class="port-text">Here is some of my work that I've done in various programming languages.</p>
    <div class="portfolios">
      @for (p of c.projects; track p.name) {
        <div class="portfolio-item">
          <div class="image">
            <img [src]="'img/' + p.image" [alt]="p.name" />
          </div>
          <div class="hover-items">
            <h3>{{ p.name }}</h3>
            <div class="icons">
              @if (p.github) {
                <a [href]="p.github" target="_blank" class="icon" aria-label="GitHub repo">
                  <i class="fab fa-github"></i>
                </a>
              }
              @if (p.live) {
                <a [href]="p.live" target="_blank" class="icon" aria-label="Live site">
                  <i class="fas fa-globe"></i>
                </a>
              }
              @if (p.youtube) {
                <a [href]="p.youtube" target="_blank" class="icon" aria-label="Video demo">
                  <i class="fab fa-youtube"></i>
                </a>
              }
            </div>
          </div>
        </div>
      }
    </div>
  }
</section>
